{% include 'home/base.html' %}

<div class="container">
    <h1>Register</h1>
    <p>Create your SecureGov account below.</p>

    <form method="post" class="form-card">
        {% csrf_token %}

        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter username" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter email" required>

        <label for="nric">NRIC (Identity Number)</label>
        <input type="text" id="nric" name="nric" placeholder="e.g. S1234567A" required style="text-transform: uppercase;">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required>

        <label for="password2">Confirm Password</label>
        <input type="password" id="password2" name="password2" placeholder="Confirm password" required>

        <button type="submit" class="btn-primary">Register</button>
    </form>

    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
        <li>{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}
</div>

<style>
/* Container */
.container {
    max-width: 500px;
    margin: 50px auto;
    padding: 20px;
    border: 1px solid #ddd;
    border-radius: 10px;
    background-color: #f8f9fa;
}

/* Form Styling */
.form-card label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
    color: #0A2342;
}

.form-card input {
    width: 100%;
    padding: 8px 10px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 5px;
    /* Ensure padding doesn't affect width */
    box-sizing: border-box; 
}

/* Button */
.btn-primary {
    width: 100%;
    padding: 10px;
    background-color: #0A2342;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
}

.btn-primary:hover {
    background-color: #08304d;
}

/* Messages */
.messages {
    list-style-type: none;
    padding: 0;
    margin-top: 15px;
}

.messages li {
    background-color: #ffe0e0;
    color: #a00;
    padding: 8px;
    border-radius: 5px;
    margin-bottom: 5px;
}
</style>
