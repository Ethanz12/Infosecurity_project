{% extends "home/base.html" %}

{% block title %}Logout - SecureGov{% endblock %}

{% block content %}
<h1>Confirm Logout</h1>

<p>Are you sure you want to log out?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn-primary">Logout</button>
</form>

<br>
<a href="{% url 'home' %}">Cancel</a>

{% endblock %}
