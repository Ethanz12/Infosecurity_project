{% include 'home/base.html' %}

<div class="container" style="max-width: 600px; margin-top: 50px;">
    <h2>Create Support Ticket</h2>
    <p class="text-muted">Describe your issue below. A government officer will review it shortly.</p>
    
    <form method="post" class="card p-4 shadow-sm">
        {% csrf_token %}

        <div class="mb-3">
            <label for="department" class="form-label">Department</label>
            <select name="department" id="department" class="form-select" required>
                <option value="" selected disabled>-- Select Government Agency --</option>
                {% for code, name in departments %}
                    <option value="{{ code }}">{{ name }}</option>
                {% endfor %}
            </select>
            <div class="form-text">This routes your request to the correct agency.</div>
        </div>

        <div class="mb-3">
            <label for="category" class="form-label">Service Type (For Health Dept)</label>
            <select name="category" id="category" class="form-select" required>
                {% for code, label in categories %}
                    <option value="{{ code }}">{{ label }}</option>
                {% endfor %}
            </select>
            <div class="form-text text-danger">
                
            </div>
        </div>
        
        <div class="mb-3">
            <label for="subject" class="form-label">Subject</label>
            <input type="text" name="subject" id="subject" class="form-control" placeholder="e.g. NRIC Renewal Issue" required>
        </div>
        
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea name="description" id="description" class="form-control" rows="5" placeholder="Please provide details..." required></textarea>
        </div>
        
        <button type="submit" class="btn btn-primary w-100">Submit Ticket</button>
    </form>
</div>
