<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}SecureGov{% endblock %}</title>
    <style>
        body { 
            margin: 0; 
            font-family: Arial, sans-serif; 
            background: #f8f9fa; 
        }
        .navbar {
            background-color: #0A2342;
            display: flex;
            align-items: center;
            padding: 10px 20px;
            gap: 10px;
        }
        .navbar a {
            color: white; 
            text-decoration: none; 
            font-weight: bold; 
            padding: 8px 12px; 
            border-radius: 4px;
        }
        .navbar a:hover { 
            background-color: #08304d; 
        }
        .navbar .user-info {
            margin-left: auto; /* Push to right */
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            font-weight: bold;
        }
        .navbar .user-info span {
            background-color: #08304d;
            padding: 5px 10px;
            border-radius: 5px;
        }
        .container {
            max-width: 500px; 
            margin: 50px auto; 
            padding: 20px;
            border: 1px solid #ddd; 
            border-radius: 10px; 
            background: white;
        }
        .form-card label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: bold; 
            color: #0A2342; 
        }
        .form-card input { 
            width: 100%; 
            padding: 8px 10px; 
            margin-bottom: 15px; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
        }
        .btn-primary {
            width: 100%; 
            padding: 10px; 
            background-color: #0A2342; 
            color: white;
            border: none; 
            border-radius: 5px; 
            font-size: 16px; 
            cursor: pointer;
        }
        .btn-primary:hover { 
            background-color: #08304d; 
        }
        .messages { 
            list-style: none; 
            padding: 0; 
            margin-top: 15px; 
        }
        .messages li { 
            background: #ffe0e0; 
            color: #a00; 
            padding: 8px; 
            border-radius: 5px; 
            margin-bottom: 5px; 
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="{% url 'home' %}">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
        <div class="user-info">
            {% if user.is_authenticated %}
                <span>Hello, {{ user.username }}!</span>
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </div>

    <div class="container">
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
