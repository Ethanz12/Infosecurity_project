<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}SecureGov{% endblock %}</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Navbar styling */
        .navbar {
            background-color: #0A2342;
            overflow: hidden;
            padding: 10px 20px;
        }

        .navbar a {
            float: left;
            color: white;
            text-decoration: none;
            padding: 12px 16px;
            font-weight: bold;
        }

        .navbar a:hover {
            background-color: #0C2C57;
        }

        /* Page content */
        .content {
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="{% url 'home' %}">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
        <a href="{% url 'register' %}">register</a>
        <!-- Add more links as needed -->
    </div>

    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
