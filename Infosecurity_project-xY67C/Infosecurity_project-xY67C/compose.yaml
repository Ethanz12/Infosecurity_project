services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: securegov-backend
    # Use Gunicorn for production instead of Django dev server
    command: gunicorn ISPJ_Web_App.wsgi:application --bind 0.0.0.0:8000 --workers 3
    ports:
      - "8000:8000"
    env_file:
      - backend.env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/app
    restart: always

  mysql:
    image: mysql:8.0
    container_name: securegov-mysql
    restart: always
    env_file:
      - backend.env
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional future service for AI-based Data Classification
  # classifier:
  #   build: ./classifier
  #   restart: always
  #   depends_on:
  #     - backend

volumes:
  db-data:
