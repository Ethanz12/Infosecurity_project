version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: securegov-backend
    ports:
      - "8000:8000"
    env_file:
      - backend.env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/app
    restart: always

  mysql:
    image: mysql:8.0
    container_name: securegov-mysql
    restart: always
    env_file:
      - backend.env
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
