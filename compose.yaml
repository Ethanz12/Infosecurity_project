version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: securegov-backend
    # --- THIS IS THE LINE THAT CHANGED ---
    command: python manage.py runserver_plus --cert-file cert.crt --threaded 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - backend.env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/app
    restart: always

  mysql:
    image: mysql:8.0
    container_name: securegov-mysql
    restart: always
    env_file:
      - backend.env
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3307:3306"
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "secureuser", "-pP@ssw0rd"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data: